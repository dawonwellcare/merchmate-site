name: unpack-site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site.zip
        run: |
          if [ -f site.zip ]; then
            unzip -o site.zip
            rm site.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Unpack site files"
            git push
          fi
